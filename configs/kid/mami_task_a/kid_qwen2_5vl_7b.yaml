### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
quantization_bit: 4
quantization_method: bitsandbytes
seed: 42

### method
stage: sft-classifier_multiclass
do_train: true
finetuning_type: lora
lora_target: all
lora_alpha: 256
lora_dropout: 0.05
lora_rank: 128

### dataset
dataset: ${TRAIN_DATASET}
template: qwen2_vl
cutoff_len: 2048
max_samples: 400000
overwrite_cache: true
preprocessing_num_workers: 16
media_dir: ./data/image/MAMI/All/

### output
output_dir: outputs/kid/${DATE}_${RUN_NAME}
logging_dir: outputs/kid/logs/${DATA_VERSION}/${DATE}_${RUN_NAME}
logging_steps: 1
save_steps: 400
plot_loss: true
overwrite_output_dir: false

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 4.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
flash_attn: disabled
enable_liger_kernel: false

### eval
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100
eval_dataset: ${EVAL_DATASET}

report_to: tensorboard
run_name: ${RUN_NAME}

### KID objective
loss_ratio: [1.0, 1.0]
classifier_lr: 1e-4
num_layers: 3
dropout: [0.2, 0.4, 0.1]
output_dim: 2
classifier_class_names: non-misogynous,misogynous

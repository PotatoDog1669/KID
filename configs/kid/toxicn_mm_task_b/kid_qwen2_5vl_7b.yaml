### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
quantization_bit: 4
quantization_method: bitsandbytes  # choices: [bitsandbytes (4/8), hqq (2/3/4/5/6/8), eetq (8)]
seed: 42

### method
stage: sft-classifier_multiclass
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
# lora_alpha: 128
lora_alpha: 64
# lora_dropout: 0.05
lora_rank: 32
# lora_rank: 64
# lora_rank: 128
#deepspeed: examples/deepspeed/ds_z3_config.json


### dataset
dataset: ${TRAIN_DATASET} # video: mllm_video_demo
template: qwen2_vl
cutoff_len: 2048 
max_samples: 400000 # 400000
# max_samples: 32 # 400000
overwrite_cache: true
preprocessing_num_workers: 16
media_dir: ./data/image/ToxiCN_MM/


### output
output_dir: outputs/kid/${DATE}_${RUN_NAME}
logging_dir: outputs/kid/logs/${DATA_VERSION}/${DATE}_${RUN_NAME}
logging_steps: 1
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
flash_attn: disabled
enable_liger_kernel: false
lora_dropout: 0.1

### eval
#val_size: 0.001
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 50
eval_dataset: ${EVAL_DATASET}

report_to: tensorboard
run_name: ${RUN_NAME}


### KID objective
loss_ratio: [1.0, 1.0] 
# classifier_lr: 5e-5
classifier_lr: 1e-4
input_dropout: 0.1
# input_dropout: 0.1
dropout: [0.2,0.2]
#custom_debug: true
output_dim: 4
embed_mode: last_token #choices: [pool, last_token]
embed_layer: last # choices: [last, penultimate]
